<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Aspazijas debesjums</title>

    <style>
        /* =========================================================
           FONT
           ========================================================= */

        @font-face {
            font-family: "MomoSignature";
            src: url("assets/MomoSignature-Regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }


        /* =========================================================
           GLOBAL
           ========================================================= */

        :root {
            --yellow: #E8D214;
            --design-width: 1920;
            --design-height: 1080;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }

        body {
            font-family: "MomoSignature", cursive;
            color: var(--yellow);

            user-select: none;
            -webkit-user-select: none;
        }

        button {
            font-family: "MomoSignature", cursive;
        }

        #app {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;
        }


        /* =========================================================
           SCREEN SISTĒMA
           ========================================================= */

        .screen {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            opacity: 0;
            visibility: hidden;

            transition: none;

            z-index: 1;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;

            transition: none;

            z-index: 10;
        }


        /* =========================================================
           VIDEO
           ========================================================= */

        .fullscreen-video {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            background: #000;
        }


        /* =========================================================
           LINGERING
           ========================================================= */

        #lingeringScreen {
            background: #000;
        }

        #lingeringImage {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        #startButton {
            position: absolute;

            left: 50%;
            top: 50%;

            --start-button-size: 143px;

            width: var(--start-button-size);
            height: var(--start-button-size);

            transform: translate(-50%, -50%);

            padding: 0;
            margin: 0;

            border: none;
            border-radius: 50%;

            background: rgba(232, 210, 20, 0.5);

            animation: start-button-pulse 1s ease-in-out infinite alternate;

            cursor: pointer;

            z-index: 100;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }

        #startButton:hover {
            transform:
                translate(-50%, -50%)
                scale(1.05);

            background:
                rgba(232, 210, 20, 0.65);
        }

        #startButton:active {
            transform:
                translate(-50%, -50%)
                scale(0.96);
        }

        @keyframes start-button-pulse {
            from {
                width: 128.7px;
                height: 128.7px;
            }

            to {
                width: 157.3px;
                height: 157.3px;
            }
        }

        @keyframes start-button-pulse-mobile {
            from {
                width: 105.3px;
                height: 105.3px;
            }

            to {
                width: 128.7px;
                height: 128.7px;
            }
        }


        /* =========================================================
           GALVENĀ IZVĒLNE
           40 PX
           ========================================================= */

        .main-menu {
            position: absolute;

            inset: 0;

            pointer-events: none;
        }

        .main-menu-button {
            position: absolute;

            padding: 0;
            margin: 0;

            border: none;

            background: transparent;

            color: var(--yellow);

            font-family:
                "MomoSignature",
                cursive;

            font-size: 55px;

            font-weight: normal;

            line-height: 1.05;

            text-align: center;

            cursor: pointer;

            white-space: nowrap;

            opacity: 0;

            pointer-events: none;

            transform: translate(-50%, -50%);

            transition:
                opacity 1s ease;
        }

        .main-menu.visible
        .main-menu-button {
            opacity: 1;

            pointer-events: auto;

        }

        .main-menu-button:hover {
            text-shadow:
                0 0 10px
                rgba(232, 210, 20, 0.55);
        }


        /* =========================================================
           GALVENĀS IZVĒLNES KOORDINĀTES
           ========================================================= */

        #cilveks {
            left: 778px;
            top: 292.5px;
        }

        #zeme {
            left: 442px;
            top: 763px;
        }

        #visums {
            left: 1510.5px;
            top: 269.5px;
        }

        #mitologija {
            left: 1803px;
            top: 777.5px;
        }

        #aspazijasDebesjums {
            left: 1137px;
            top: 634px;

            width: 440px;

            white-space: normal;
        }


        /* =========================================================
           SEKCIJU VIDEO EKRĀNI
           ========================================================= */

        .section-video-screen {
            background: #000;
        }


        /* =========================================================
           VIDEO HOME POGA
           2 SEKUNDĒ
           ========================================================= */

        .video-home-button {
            position: absolute;

            left: 0;
            top: 0;

            padding: 0;
            margin: 0;

            border: none;

            background: transparent;

            cursor: pointer;

            opacity: 0;

            pointer-events: none;

            transform: translateY(-10px);

            z-index: 100;

            transition:
                opacity 1s ease,
                transform 1s ease;
        }

        .video-home-button img {
            display: block;

            width: 142px;
            height: 142px;
        }

        .section-video-screen.controls-visible
        .video-home-button {
            opacity: 1;

            pointer-events: auto;

            transform: translateY(0);
        }


        /*
         * Aspazijas debesjuma video laikā
         * HOME NAV redzams.
         */

        #aspazijasVideoScreen
        .video-home-button {
            display: none;
        }


        /* =========================================================
           APAKŠIZVĒLNE
           PARĀDĀS VIDEO 5. SEKUNDĒ
           ========================================================= */

        .sub-menu {
            position: absolute;

            inset: 0;

            pointer-events: none;

            opacity: 0;

            z-index: 50;

            transition:
                opacity 1.2s ease;
        }

        .sub-menu.visible {
            opacity: 1;

            pointer-events: auto;
        }

        .sub-menu-button {
            position: absolute;

            padding: 0;
            margin: 0;

            border: none;

            background: transparent;

            color: var(--yellow);

            font-family:
                "MomoSignature",
                cursive;

            font-size: 75px;

            font-weight: normal;

            line-height: 1.0;

            text-align: center;

            cursor: pointer;

            opacity: 0;

            transform: translate(-50%, calc(-50% + 20px));

            transition:
                opacity 1.2s ease,
                transform 1.2s ease;
        }

        .sub-menu.visible
        .sub-menu-button {
            opacity: 1;

            transform: translate(-50%, -50%);
        }

        .sub-menu-button:hover {
            text-shadow:
                0 0 12px
                rgba(232, 210, 20, 0.55);
        }

        .multiline {
            white-space: normal;
        }


        /* =========================================================
           PNG SKATĪTĀJS
           ========================================================= */

        #imageScreen {
            position: absolute;

            --image-fade-duration: 5s;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow-x: hidden;
            overflow-y: auto;

            background: #000;

            /*
             * ĻOTI lēns fade PNG ielādes gadījumā.
             */
            opacity: 0;

            visibility: hidden;

            transition:
                opacity var(--image-fade-duration) ease,
                visibility 0s linear var(--image-fade-duration);

            z-index: 50;

            -webkit-overflow-scrolling: touch;
        }

        #imageScreen.active {
            opacity: 1;

            visibility: visible;

            transition:
                opacity var(--image-fade-duration) ease,
                visibility 0s linear 0s;

            z-index: 100;
        }

        #imageScreen.loading {
            opacity: 0;
        }

        #imageContainer {
            position: relative;

            width: 100%;
            min-height: 100%;

            background: #000;
        }

        #contentImage {
            display: block;

            width: 100%;
            height: auto;
            max-width: 100%;

            background: #000;
        }


        /* =========================================================
           PNG NAVIGĀCIJA
           ========================================================= */

        .image-nav-button {
            position: fixed;

            padding: 0;
            margin: 0;

            border: none;

            background: transparent;

            cursor: pointer;

            z-index: 200;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .image-nav-button img {
            display: block;

            width: 142px;
            height: 142px;
        }

        #imageHomeButton {
            left: 0;
            top: 0;
        }

        #imageBackButton {
            left: 150px;
            top: 0;
        }

        #imageForwardButton {
            right: 0;
            top: 0;
        }

        .image-nav-button:hover {
            filter: brightness(1.25);
        }

        .image-nav-button.disabled {
            opacity: 0.3;

            pointer-events: none;
        }


        /* =========================================================
           MELNĀ FADE
           ========================================================= */

        #fadeOverlay {
            position: fixed;

            inset: 0;

            background: #000;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            z-index: 9999;

            transition:
                opacity var(--fade-duration, 1s) ease,
                visibility 0s linear 1s;
        }

        #fadeOverlay.active {
            opacity: 1;

            visibility: visible;

            transition:
                opacity var(--fade-duration, 1s) ease,
                visibility 0s linear 0s;
        }


        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (
            max-width: 700px
        ) {

            .main-menu-button {
                font-size: 30px;
            }

            .sub-menu-button {
                font-size: 75px;
            }

            #aspazijasDebesjums {
                width: 300px;
            }

            #startButton {
                --start-button-size: 117px;
                animation-name: start-button-pulse-mobile;
            }
        }
    </style>
</head>

function fadeToBlack(duration = 1000) {

/* ================================================================
   VIDEO STOP
   ================================================================ */

function stopVideo(video) {

    if (!video) {
        return;
    }

    try {

        video.pause();

    } catch (error) {}

}


function resetVideo(video) {

    if (!video) {
        return;
    }

    try {

        video.pause();

        video.currentTime = 0;

    } catch (error) {}

}


function stopAllVideos() {

    [
        introVideo,

        transitionVideo,

        repeatVideo,

        ...Object.values(
            sectionVideos
        )

    ].forEach(
        video => stopVideo(video)
    );

    if (activeOutroVideo) {

        stopVideo(activeOutroVideo);

        activeOutroScreen.remove();

        activeOutroVideo = null;

        activeOutroScreen = null;

    }

}


/* ================================================================
   VIDEO PLAY
   ================================================================ */

async function playVideo(video) {

    if (!video) {
        return;
    }

    try {

        video.currentTime = 0;

    } catch (error) {}

    /*
     * Tā kā sākotnējais klikšķis nāk no lietotāja,
     * mēģinām atskaņot ar skaņu.
     */

    video.muted = false;

    try {

        await video.play();

    } catch (error) {

        /*
         * Ja pārlūks bloķē skaņu,
         * mēģinām muted režīmu.
         */

        video.muted = true;

        try {

            await video.play();

        } catch (secondError) {

            console.error(
                "Video nevarēja sākties:",
                secondError
            );

        }

    }

}


/* ================================================================
   VIDEO TIMEOUT
   ================================================================ */

function clearVideoTimeout() {

    if (videoTimeout) {

        clearTimeout(
            videoTimeout
        );

        videoTimeout = null;

    }

}


function handleVideoTimeout() {

    if (
        repeatScreen.classList.contains("active") &&
        !repeatVideo.paused &&
        !repeatVideo.ended &&
        repeatVideo.currentTime > 0
    ) {

        videoTimeout =
            setTimeout(
                handleVideoTimeout,
                250
            );

        return;

    }

    resetToBeginning(true);

}


function startVideoTimeout() {

    clearVideoTimeout();

    videoTimeout =
        setTimeout(
            handleVideoTimeout,
            CONFIG.videoTimeout
        );

}

        return;

    currentSection =
        section;

    clearTimers();

    clearVideoTimeout();

    mainMenu.classList.remove(
        "visible"
    );

    /*
     * JEBKURA poga:

     * intro_transition.mp4
     */

    stopAllVideos();

    resetVideo(
        transitionVideo
    );

    showScreen(
        transitionScreen
    );

    await playVideo(
        transitionVideo
    );

    startVideoTimeout();

    await waitForEnded(
        transitionVideo
    );

    /*
     * Pēc transition beigām
     * palaižam konkrēto video.
     */

    if (
        section ===
        "aspazijas"
    ) {

        resetVideo(
            sectionVideos.aspazijas
        );

            aspazijasScreen
        );

        sectionVideos.aspazijas
            .addEventListener(
                "ended",
                handleAspazijasEnded,
                {
                    once: true
                }
            );

        await playVideo(
            sectionVideos.aspazijas
        );

        startVideoTimeout();

        /* Aspazijas video beigās atveras PNG; home poga nav redzama. */

    } else {

        await openRegularSection(
            section
        );

    }

    isBusy = false;

/* ================================================================

   ================================================================ */

async function goToOutro(
    section
) {

    if (isBusy) {
        return;
    }

    isBusy = true;

    clearTimers();

    clearVideoTimeout();

    /*
     * Outro NEattiecas uz Aspazijas,
     * jo home tur vispār nav.
     */

    const outro =
        outroFiles[
            section
        ];

    if (!outro) {

        isBusy = false;

        return;

    }

    stopAllVideos();

    const outroVideo =
        outroVideos[section];

    resetVideo(outroVideo);


    const outroScreen =
        document.createElement(
            "section"
        );

    outroScreen.className =
        "screen active";

    outroScreen.style.opacity =
        "1";

    outroScreen.style.visibility =
        "visible";

    outroScreen.style.zIndex =
        "20";

    activeOutroVideo = outroVideo;

    activeOutroScreen = outroScreen;

    outroScreen.appendChild(
        outroVideo
    );

    document
        .getElementById("app")
        .appendChild(
            outroScreen
        );


    await playVideo(
        outroVideo
    );

    startVideoTimeout();

    isBusy = false;


    /*
     * Outro video līdz beigām:
     * pēdējais frame paliek freeze.
     */

    await waitForEnded(
        outroVideo
    );

    if (!outroVideo.ended) {

        return;

    }


    /*
     * Pēc outro:
     * intro_repeat.mp4
     */

    outroVideo.classList.add(
        "freeze"
    );

    outroVideo.pause();

    outroScreen.remove();

    activeOutroVideo = null;

    activeOutroScreen = null;

    await startIntroRepeat();

    isBusy = false;

}


/* ================================================================
   VIDEO ENDED
   ================================================================ */

function waitForEnded(video) {

    return new Promise(
        resolve => {

            if (video.ended) {

                resolve();

                return;

            }

            video.addEventListener(
                "ended",
                resolve,
                {
                    once: true
                }
            );

            video.addEventListener(
                "pause",
                resolve,
                {
                    once: true
                }
            );

        }
    );

}

/* ================================================================
   PNG ATVĒRŠANA
   ================================================================ */

function openImage(
    section,
    index
) {

    const group =
        imageGroups[
            section
        ];

    if (!group) {
        return;
    }

    currentSection =
        section;

    currentImageGroup =
        group;

    currentImageIndex =
        index;

    const fadeDuration =
        group[index].toLowerCase().endsWith(".webp")
            ? CONFIG.imageFadeDuration / 2
            : CONFIG.imageFadeDuration;

    imageScreen.style.setProperty(
        "--image-fade-duration",
        `${fadeDuration}ms`
    );


    /* Idle taimeris darbojas arī attēlu ekrānā. */

    clearVideoTimeout();

    startVideoTimeout();

    clearTimers();

    stopAllVideos();


    /*
     * PNG ielāde.
     */

    imageScreen.classList.remove(
        "active"
    );

    imageScreen.classList.add(
        "loading"
    );


    const image =
        new Image();


    image.onload = () => {

        contentImage.src =
            image.src;

        imageScreen.scrollTop =
            0;

        updateImageButtons();


        /*
         * ĻOOOTI lēns fade-in.
         */

        imageScreen.classList.add(
            "active"
        );

        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    () => {

                        imageScreen.classList.remove(
                            "loading"
                        );

                    }
                );

            }
        );

    };


    image.onerror = () => {

        console.error(
            "PNG neizdevās ielādēt:",
            group[index]
        );

        /*
         * Arī kļūdas gadījumā
         * atgriežam opacity.
         */

        contentImage.src =
            "";

        imageScreen.classList.add(
            "active"
        );

        imageScreen.classList.remove(
            "loading"
        );

    };


    image.src =
        `assets/${group[index]}`;

}

async function resetToBeginning(force = false) {

    if (isBusy && !force) {

    isBusy = true;

    clearTimers();

    clearVideoTimeout();

    await fadeToBlack();

    stopAllVideos();

    /*
     * Atiestatām visus video.
     */

    [
        introVideo,

        transitionVideo,

        repeatVideo,

        ...Object.values(
            sectionVideos
        )

    ].forEach(
        video => resetVideo(video)
    );


    /*
     * Paslēpjam izvēlnes.
     */

    mainMenu.classList.remove(
        "visible"
    );

    repeatMenu.classList.remove(
        "visible"
    );


    document
        .querySelectorAll(
            ".sub-menu"
        )
        .forEach(
            menu => {

                menu.classList.remove(
                    "visible"
                );

            }
        );


    document
        .querySelectorAll(
            ".section-video-screen"
        )
        .forEach(
            screen => {

                screen.classList.remove(
                    "controls-visible"
                );

            }
        );


    /*
     * PNG aizveram.
     */

    imageScreen.classList.remove(
        "active"
    );


    /*
     * Sākums:
     * lingering.png.
     */

    showScreen(
        lingeringScreen
    );


    /*
     * Lingering ekrānam nav taimera.
     */

    await fadeFromBlack();

    isBusy = false;

}

        if (
            imageScreen.classList.contains(
                "active"
            )
        ) {

            if (
                event.key ===
                "ArrowLeft"
            ) {

                imageBackButton.click();

            }


            if (
                event.key ===
                "ArrowRight"
            ) {

                imageForwardButton.click();

            }

        }

    }
);


[
    "pointerdown",
    "pointermove",
    "keydown",
    "wheel",
    "touchstart",
    "touchmove"
].forEach(
    eventName => {

        document.addEventListener(
            eventName,
            () => {

                if (
                    lingeringScreen.classList.contains("active") ||
                    !videoTimeout
                ) {
                    return;
                }

                startVideoTimeout();

            },
            { passive: true }
        );

    }
);


/* ================================================================
   INIT
   ================================================================ */

function init() {

    /*
     * Obligāti sākam ar lingering.
     */

    showScreen(
        lingeringScreen
    );


    /*
     * Lingering paliek bezgalīgi.
     */

    clearVideoTimeout();


    /*
     * Galvenā izvēlne sākumā neredzama.
     */

    mainMenu.classList.remove(
        "visible"
    );


    /*
     * Preload.
     */

    preloadImages();


    /*
     * Sākotnējā koordinātu sistēma.
     */

    scaleMenu(
        mainMenu
    );

    scaleMenu(
        repeatMenu
    );

}


/* ================================================================
   START
   ================================================================ */

init();

</script>

</body>
</html>
