<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Aspazijas debesjums</title>

    <style>
        /* =========================================================
           FONT
           ========================================================= */

        @font-face {
            font-family: "MomoSignature";
            src: url("assets/MomoSignature-Regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }


        /* =========================================================
           GLOBAL
           ========================================================= */

        :root {
            --yellow: #E8D214;
            --design-width: 1920;
            --design-height: 1080;
            --stage-scale: 1;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }

        body {
            font-family: "MomoSignature", cursive;
            color: var(--yellow);

            user-select: none;
            -webkit-user-select: none;
        }

        button {
            font-family: "MomoSignature", cursive;
        }

        #app {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 1920px;
            height: 1080px;

            transform:
                translate(-50%, -50%)
                scale(var(--stage-scale));

            transform-origin: center;

            overflow: hidden;

            background: #000;
        }


        /* =========================================================
           SCREEN SISTĒMA
           ========================================================= */

        .screen {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            opacity: 0;
            visibility: hidden;

            transition: none;

            z-index: 1;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;

            transition: none;

            z-index: 10;
        }


        /* =========================================================
           VIDEO
           ========================================================= */

        .fullscreen-video {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            background: #000;
        }


        /* =========================================================
           LINGERING
           ========================================================= */

        #lingeringScreen {
            background: #000;
        }

        #lingeringImage,
        #lingeringSignature {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        #startButton {
            position: absolute;

            left: 50%;
            top: 50%;

            --start-button-size: 143px;

            width: var(--start-button-size);
            height: var(--start-button-size);

            transform: translate(-50%, -50%);

            padding: 0;
            margin: 0;

            border: none;
            border-radius: 50%;

            background: rgba(232, 210, 20, 0.5);

            animation: start-button-pulse 1s ease-in-out infinite alternate;

            cursor: pointer;

            z-index: 100;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }

        #startButton:hover {
            transform:
                translate(-50%, -50%)
                scale(1.05);

            background:
                rgba(232, 210, 20, 0.65);
        }

        #startButton:active {
            transform:
                translate(-50%, -50%)
                scale(0.96);
        }

        @keyframes start-button-pulse {
            from {
                width: 128.7px;
                height: 128.7px;
            }

            to {
                width: 157.3px;
                height: 157.3px;
            }
        }

        /* =========================================================
           GALVENĀ IZVĒLNE
           40 PX
           ========================================================= */

        .main-menu {
            position: absolute;

            inset: 0;

            pointer-events: none;
        }

        .main-menu-button {
            position: absolute;

            padding: 0;
            margin: 0;

            border: none;

            background: transparent;

            color: var(--yellow);

            font-family:
                "MomoSignature",
                cursive;

            font-size: 55px;

            font-weight: normal;

            line-height: 1.05;

            text-align: center;

            cursor: pointer;

            white-space: nowrap;

            opacity: 0;

            pointer-events: none;

            transform: translate(-50%, -50%);

            transition:
                opacity 1s ease;
        }

        .main-menu.visible
        .main-menu-button {
            opacity: 1;

            pointer-events: auto;

        }

        .main-menu-button:hover {
            text-shadow:
                0 0 10px
                rgba(232, 210, 20, 0.55);
        }


        /* =========================================================
           GALVENĀS IZVĒLNES KOORDINĀTES
           ========================================================= */

        #cilveks {
            left: 778px;
            top: 292.5px;
        }

        #zeme {
            left: 442px;
            top: 763px;
        }

        #visums {
            left: 1510.5px;
            top: 269.5px;
        }

        #mitologija {
            left: 1803px;
            top: 777.5px;
        }

        #aspazijasDebesjums {
            left: 1137px;
            top: 634px;

            width: 440px;

            white-space: normal;
        }


        /* =========================================================
           SEKCIJU VIDEO EKRĀNI
           ========================================================= */

        .section-video-screen {
            background: #000;
        }


        /* =========================================================
           VIDEO HOME POGA
           2 SEKUNDĒ
           ========================================================= */

        .video-home-button {
            position: absolute;

            left: 0;
            top: 0;

            padding: 0;
            margin: 0;

            border: none;

            background: transparent;

            cursor: pointer;

            opacity: 0;

            pointer-events: none;

            z-index: 100;

            transition: opacity 1s ease;
        }

        .video-home-button img {
            display: block;

            width: 120px;
            height: 120px;
        }

        .section-video-screen.controls-visible
        .video-home-button {
            opacity: 1;

            pointer-events: auto;
        }


        /*
         * Aspazijas debesjuma video laikā
         * HOME NAV redzams.
         */

        #aspazijasVideoScreen
        .video-home-button {
            display: none;
        }


        /* =========================================================
           APAKŠIZVĒLNE
           PARĀDĀS VIDEO 5. SEKUNDĒ
           ========================================================= */

        .sub-menu {
            position: absolute;

            inset: 0;

            pointer-events: none;

            opacity: 0;

            z-index: 50;

            transition:
                opacity 1.2s ease;
        }

        .sub-menu.visible {
            opacity: 1;

            pointer-events: auto;
        }

        .sub-menu-button {
            position: absolute;

            padding: 0;
            margin: 0;

            border: none;

            background: transparent;

            color: var(--yellow);

            font-family:
                "MomoSignature",
                cursive;

            font-size: 75px;

            font-weight: normal;

            line-height: 1.0;

            text-align: center;

            cursor: pointer;

            opacity: 0;

            transform: translate(-50%, -50%);

            transition:
                opacity 1.2s ease;
        }

        .sub-menu.visible
        .sub-menu-button {
            opacity: 1;

        }

        .sub-menu-button:hover {
            text-shadow:
                0 0 12px
                rgba(232, 210, 20, 0.55);
        }

        .multiline {
            white-space: normal;
        }


        /* =========================================================
           PNG SKATĪTĀJS
           ========================================================= */

        #imageScreen {
            position: absolute;

            --image-fade-duration: 5s;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow-x: hidden;
            overflow-y: auto;

            background: #000;

            opacity: 0;

            visibility: hidden;

            transition:
                visibility 0s linear var(--image-fade-duration);

            z-index: 50;

            -webkit-overflow-scrolling: touch;
        }

        #imageScreen.active {
            opacity: 1;

            visibility: visible;

            transition:
                visibility 0s linear 0s;

            z-index: 100;
        }

        #imageScreen.loading {
            visibility: visible;
        }

        #imageContainer {
            position: relative;

            width: 100%;
            min-height: 100%;

            background: transparent;

            z-index: 1;
        }

        #contentImage {
            display: block;

            width: 100%;
            height: auto;
            max-width: 100%;

            background: transparent;

            opacity: 1;

            transition:
                opacity var(--image-fade-duration) ease;
        }

        #imageScreen.loading #contentImage {
            opacity: 0;
        }

        #imageScreen.preparing #contentImage {
            opacity: 0;

            transition: none;
        }


        /* =========================================================
           PNG NAVIGĀCIJA
           ========================================================= */

        .image-nav-button {
            position: fixed;

            padding: 0;
            margin: 0;

            border: none;

            background: transparent;

            cursor: pointer;

            z-index: 200;

            display: flex;

            align-items: center;
            justify-content: center;

            opacity: 1;
            visibility: visible;

            transition:
                opacity var(--image-fade-duration) ease,
                visibility 0s linear 0s;
        }

        #imageScreen.loading .image-nav-button,
        #imageScreen.loading #imagePoemButton {
            opacity: 0;
            pointer-events: none;

            transition:
                opacity var(--image-fade-duration) ease,
                visibility 0s linear var(--image-fade-duration);
        }

        .image-nav-button img {
            display: block;

            width: 120px;
            height: 120px;
        }

        #imageHomeButton {
            left: 0;
            top: 0;
        }

        #imageBackButton {
            left: 150px;
            top: 0;
        }

        #imageForwardButton {
            right: 0;
            top: 0;
        }

        #imageReturnButton {
            left: 300px;
            top: 0;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #imageReturnButton.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        #imagePoemButton {
            position: fixed;

            left: 950px;
            top: 980px;

            width: 280px;
            height: 280px;

            transform: translate(-50%, -50%);

            padding: 0;
            border: none;
            background: transparent;

            display: flex;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity var(--image-fade-duration) ease,
                visibility 0s linear var(--image-fade-duration);

            cursor: pointer;

            z-index: 200;
        }

        #imagePoemButton.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        #imagePoemButton img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            opacity: 1;
        }

        .image-nav-button:hover {
            filter: brightness(1.25);
        }

        .image-nav-button.disabled {
            opacity: 0.3;

            pointer-events: none;
        }


        /* =========================================================
           MELNĀ FADE
           ========================================================= */

        #fadeOverlay {
            position: fixed;

            inset: 0;

            background: #000;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            z-index: 9999;

            transition:
                opacity var(--fade-duration, 1s) ease,
                visibility 0s linear 1s;
        }

        #fadeOverlay.active {
            opacity: 1;

            visibility: visible;

            transition:
                opacity var(--fade-duration, 1s) ease,
                visibility 0s linear 0s;
        }


    </style>
</head>


<body>

<div id="app">

<script>

"use strict";


/* ================================================================
   KONFIGURĀCIJA
   ================================================================ */

const CONFIG = {

    width: 1920,

    height: 1080,

    /*
     * Galvenā izvēlne:
     * parādās 2. sekundē.
     */

    mainMenuDelay: 1000,

    /*
     * Sadaļas home:
     * parādās 2. sekundē.
     */

    sectionHomeDelay: 2000,

    /*
     * Apakšizvēlne:
     * parādās 5. sekundē.
     */

    subMenuDelay: 5000,

    /*
    * Intro repeat:
    * izvēlne parādās 1. sekundē.
     */

    repeatMenuDelay: 1000,

    /*
     * 2 minūšu neaktivitātes reset.
     */

    videoTimeout: 120000,

    /*
     * PNG fade:
     * ļoti lēns.
     */

    imageFadeDuration: 5000,

    webpFadeDuration: 1000

};


/* ================================================================
   DOM
   ================================================================ */

const lingeringScreen =
    document.getElementById(
        "lingeringScreen"
    );

const introScreen =
    document.getElementById(
        "introScreen"
    );

const transitionScreen =
    document.getElementById(
        "transitionScreen"
    );

const zemeScreen =
    document.getElementById(
        "zemeVideoScreen"
    );

const cilveksScreen =
    document.getElementById(
        "cilveksVideoScreen"
    );

const visumsScreen =
    document.getElementById(
        "visumsVideoScreen"
    );

const mitologijaScreen =
    document.getElementById(
        "mitologijaVideoScreen"
    );

const aspazijasScreen =
    document.getElementById(
        "aspazijasVideoScreen"
    );

const repeatScreen =
    document.getElementById(
        "repeatScreen"
    );

const imageScreen =
    document.getElementById(
        "imageScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const fadeOverlay =
    document.getElementById(
        "fadeOverlay"
    );


const introVideo =
    document.getElementById(
        "introVideo"
    );

const transitionVideo =
    document.getElementById(
        "transitionVideo"
    );

const repeatVideo =
    document.getElementById(
        "repeatVideo"
    );

const soundtrack = new Audio(
    "assets/soundtrack.mp3"
);

soundtrack.preload = "auto";

soundtrack.loop = true;

const soundEffect = new Audio(

/* ================================================================

   ================================================================ */

function stopVideo(video) {

    if (!video) {
        return;
    }

    try {

        video.pause();

    } catch (error) {}

}


function resetVideo(video) {

    if (!video) {
        return;
    }

    try {

        video.pause();

        video.currentTime = 0;

    } catch (error) {}

}


function stopAllVideos() {

            sectionVideos

    }

}


/* ================================================================
   VIDEO PLAY
   ================================================================ */

async function playVideo(video) {

    if (!video) {
        return false;
    }

    try {

        video.currentTime = 0;

    } catch (error) {}

    /*
     * Tā kā sākotnējais klikšķis nāk no lietotāja,
     * mēģinām atskaņot ar skaņu.
     */

    video.muted = false;

    try {

        await video.play();

        return true;

    } catch (error) {

        /*
         * Ja pārlūks bloķē skaņu,
         * mēģinām muted režīmu.
         */

        video.muted = true;

        try {

            await video.play();

            return true;

        } catch (secondError) {

            console.error(
                "Video nevarēja sākties:",
                secondError
            );

            return false;

        }

    }

}


function waitForVideoFrame(video) {

    return new Promise(
        (resolve, reject) => {

            let settled = false;

            const timeout =
                setTimeout(
                    () => finish(
                        new Error(
                            `Video kadrs netika sagatavots: ${video.currentSrc}`
                        )
                    ),
                    10000
                );

            function finish(error) {

                if (settled) {
                    return;
                }

                settled = true;

                clearTimeout(timeout);

                video.removeEventListener(
                    "error",
                    handleError
                );

                if (error) {
                    reject(error);
                } else {
                    resolve();
                }

            }

            function handleError() {

                finish(
                    new Error(
                        `Video neizdevās ielādēt: ${video.currentSrc}`
                    )
                );

            }

            video.addEventListener(
                "error",
                handleError,
                { once: true }
            );

            if (
                typeof video.requestVideoFrameCallback ===
                "function"
            ) {

                video.requestVideoFrameCallback(
                    () => finish()
                );

            } else {

                function waitForDecodedFrame() {

                    if (video.readyState >= 2) {

                        requestAnimationFrame(
                            () => requestAnimationFrame(
                                () => finish()
                            )
                        );

                        return;

                    }

                    video.addEventListener(
                        "loadeddata",
                        waitForDecodedFrame,
                        { once: true }
                    );

                }

                waitForDecodedFrame();

            }

        }
    );

}


async function switchToVideoScreen(
    video,
    screen
) {

    const resetVersion =
        idleResetVersion;

    resetVideo(video);

    screen.classList.add(
        "active"
    );

    screen.style.zIndex =
        "9";

    const otherVideos = [
        introVideo,
        transitionVideo,
        repeatVideo,
        ...Object.values(sectionVideos),
        ...Object.values(outroVideos)
    ];

    if (
        activeOutroVideo &&
        !otherVideos.includes(activeOutroVideo)
    ) {
        otherVideos.push(
            activeOutroVideo
        );
    }

    otherVideos.forEach(
        otherVideo => {

            if (otherVideo !== video) {
                stopVideo(otherVideo);
            }

        }
    );

    try {

        const started =
            await playVideo(video);

        if (!started) {
            throw new Error(
                `Video nevarēja sākties: ${video.currentSrc}`
            );
        }

        await waitForVideoFrame(video);

        if (
            resetVersion !==
            idleResetVersion
        ) {
            video.pause();
            screen.classList.remove("active");
            screen.style.removeProperty("z-index");
            return false;
        }

    } catch (error) {

        video.pause();

        screen.classList.remove(
            "active"
        );

        screen.style.removeProperty(
            "z-index"
        );

        if (activeOutroScreen === screen) {
            screen.remove();
            activeOutroScreen = null;
            activeOutroVideo = null;
        }

        console.error(
            "Video pārslēgšana neizdevās:",
            error
        );

        return false;

    }

    const previousOutroScreen =
        activeOutroScreen !== screen
            ? activeOutroScreen
            : null;

    showScreen(screen);

    screen.style.removeProperty(
        "z-index"
    );

    if (previousOutroScreen) {

        previousOutroScreen.remove();

        activeOutroScreen = null;

        activeOutroVideo = null;

    }

    otherVideos.forEach(
        otherVideo => {

            if (otherVideo !== video) {
                stopVideo(otherVideo);
            }

        }
    );

    return true;

}


function startSoundtrack() {

    soundtrackPlaybackVersion += 1;

    const playbackVersion =
        soundtrackPlaybackVersion;

    if (soundtrackFadeFrame !== null) {

        cancelAnimationFrame(
            soundtrackFadeFrame
        );

        soundtrackFadeFrame = null;

    }

    soundtrack.currentTime = 0;

    soundtrack.volume = 0;

    soundtrack.play().then(
        () => {

            if (
                playbackVersion !==
                soundtrackPlaybackVersion
            ) {
                return;
            }

            const fadeStartedAt =
                performance.now();

            function updateSoundtrackVolume(now) {

                if (
                    playbackVersion !==
                    soundtrackPlaybackVersion
                ) {
                    return;
                }

                const progress = Math.min(
                    (now - fadeStartedAt) /
                        soundtrackFadeDuration,
                    1
                );

                soundtrack.volume =
                    progress * soundtrackVolume;

                if (progress < 1) {

                    soundtrackFadeFrame =
                        requestAnimationFrame(
                            updateSoundtrackVolume
                        );

                } else {

                    soundtrackFadeFrame = null;

                }

            }

            soundtrackFadeFrame =
                requestAnimationFrame(
                    updateSoundtrackVolume
                );

        }
    ).catch(
        error => {

            console.error(
                "Soundtrack nevarēja sākties:",
                error
            );

        }
    );

}


function stopSoundtrack() {

    soundtrackPlaybackVersion += 1;

    if (soundtrackFadeFrame !== null) {

        cancelAnimationFrame(
            soundtrackFadeFrame
        );

        soundtrackFadeFrame = null;

    }

    soundtrack.pause();

    soundtrack.currentTime = 0;

    soundtrack.volume = soundtrackVolume;

}


function playSectionSoundEffect() {

    soundEffect.currentTime = 0;

    try {

        if (!soundEffectAudioContext) {

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContextClass) {
                throw new Error(
                    "Pārlūks neatbalsta skaņas pastiprināšanu."
                );
            }

            soundEffectAudioContext =
                new AudioContextClass();

            const soundEffectSource =
                soundEffectAudioContext.createMediaElementSource(
                    soundEffect
                );

            const soundEffectGain =
                soundEffectAudioContext.createGain();

            soundEffectGain.gain.value =
                soundEffectVolume;

            soundEffectSource.connect(
                soundEffectGain
            );

            soundEffectGain.connect(
                soundEffectAudioContext.destination
            );

        }

        soundEffectAudioContext
            .resume()
            .then(
                () => soundEffect.play()
            )
            .catch(
                error => {

                    console.error(
                        "Sound effect nevarēja sākties:",
                        error
                    );

                }
            );

    } catch (error) {

        console.error(
            "Sound effect skaļumu nevarēja palielināt:",
            error
        );

    }

}

        section;

        section ===

        const video =
            sectionVideos[

            await switchToVideoScreen(
                video,
                aspazijasScreen

            await waitForEnded(
                video

            if (video.ended) {

                openImage(
                    "aspazijas",
                    0
                );

            }

        isBusy = false;

        return;

    }

    /*

     * intro_transition.mp4
     */

    const transitionStarted =
        await switchToVideoScreen(
            transitionVideo,
            transitionScreen
        );

        isBusy = false;
        return;
    }

    await waitForEnded(
        transitionVideo
    );

    if (!transitionVideo.ended) {
        isBusy = false;
        return;
    }

    /*
     * Pēc transition beigām
     * palaižam konkrēto video.
     */

    await openRegularSection(
        section
    );

    isBusy = false;

async function goToOutro(
    section
) {

    if (isBusy) {
        return;
    }

    isBusy = true;

    clearTimers();

    /*
     * Outro NEattiecas uz Aspazijas,
     * jo home tur vispār nav.
     */

    const outro =
        outroFiles[
            section
        ];

    if (!outro) {

        isBusy = false;

        return;

    }

    const outroVideo =
        outroVideos[section];

    const outroScreen =
        document.createElement(
            "section"
        );

    outroScreen.className =
        "screen";

    outroScreen.style.opacity =
        "1";

    outroScreen.style.visibility =
        "visible";

    activeOutroVideo = outroVideo;

    activeOutroScreen = outroScreen;

    outroScreen.appendChild(
        outroVideo
    );

    document
        .getElementById("app")
        .appendChild(
            outroScreen
        );


    const outroStarted =
        await switchToVideoScreen(
            outroVideo,
            outroScreen
        );

    if (!outroStarted) {
        isBusy = false;
        return;
    }

    isBusy = false;


    /*
     * Outro video līdz beigām:
     * pēdējais frame paliek freeze.
     */

    await waitForEnded(
        outroVideo
    );

    if (!outroVideo.ended) {

        return;

    }


    /*
     * Pēc outro:
     * intro_repeat.mp4
     */

    await startIntroRepeat();

    isBusy = false;

}


/* ================================================================
   VIDEO ENDED
   ================================================================ */

function waitForEnded(video) {

    return new Promise(
        resolve => {

            if (video.ended) {

                resolve();

                return;

            }

            video.addEventListener(
                "ended",
                resolve,
                {
                    once: true
                }
            );

            video.addEventListener(
                "pause",
                resolve,
                {
                    once: true
                }
            );

        }
    );

}

    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    openSection(
                        button.dataset.section
                    );

                }
            );

        }
    );


/* ================================================================
   APAKŠIZVĒLŅU POGAS
   ================================================================ */

document
    .querySelectorAll(
        ".sub-menu-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const screen =
                        button.closest(
                            ".section-video-screen"
                        );

                    if (!screen) {
                        return;
                    }

                    let section = null;


                    if (
                        screen.id ===
                        "zemeVideoScreen"
                    ) {

                        section =
                            "zeme";

                    } else if (
                        screen.id ===
                        "cilveksVideoScreen"
                    ) {

                        section =
                            "cilveks";

                    } else if (
                        screen.id ===
                        "visumsVideoScreen"
                    ) {

                        section =
                            "visums";

                    } else if (
                        screen.id ===
                        "mitologijaVideoScreen"
                    ) {

                        section =
                            "mitologija";

                    }


                    if (!section) {
                        return;
                    }


                    const group =
                        imageGroups[
                            section
                        ];

                    const index =
                        group.indexOf(
                            button.dataset.image
                        );


                    if (index === -1) {
                        return;
                    }


                    openImage(
                        section,
                        index
                    );

                }
            );

        }
    );


/* ================================================================
   PNG ATVĒRŠANA
   ================================================================ */

function openImage(
    section,
    index,
    showPoem = false
) {

    const group =
        imageGroups[
            section
        ];

    if (!group) {
        return;
    }

    const baseImage =
        group[index];

    const imageFilename =
        showPoem
            ? poemImageFiles[baseImage]
            : baseImage;

    if (!imageFilename) {
        return;
    }

    currentSection =
        section;

    currentImageGroup =
        group;

    currentImageIndex =
        index;

    const requestVersion =
        ++imageRequestVersion;

    imageReturnButton.classList.toggle(
        "visible",
        showPoem
    );

    imagePoemButton.classList.toggle(
        "visible",
        !showPoem &&
            Object.prototype.hasOwnProperty.call(
                poemImageFiles,
                baseImage
            )
    );

    let imagePoemButtonSource = null;

    if (!showPoem) {

        const buttonName =
            baseImage.replace(
                /\.webp$/i,
                ""
            );

        imagePoemButtonSource =
            `assets/poga_${buttonName}.png`;

    }

    const fadeDuration =
        imageFilename.toLowerCase().endsWith(".webp")
            ? CONFIG.webpFadeDuration
            : CONFIG.imageFadeDuration;

    const isChangingVisibleImage =
        imageScreen.classList.contains("active") &&
        !imageScreen.classList.contains("loading") &&
        Boolean(contentImage.getAttribute("src"));

    imageScreen.classList.toggle(
        "preparing",
        !isChangingVisibleImage
    );

    const fadeStartedAt =
        performance.now();

    imageScreen.style.setProperty(
        "--image-fade-duration",
        `${fadeDuration}ms`
    );


    clearTimers();

    stopAllVideos();


    /*
     * Attēla maiņas laikā attēlu ekrāns paliek necaurspīdīgi melns,
     * bet pats attēls izdziest un iedegas.
     */

    imageScreen.classList.add(
        "active"
    );

    imageScreen.classList.add(
        "loading"
    );


    const image =
        new Image();


    image.onload = async () => {

        if (
            requestVersion !==
            imageRequestVersion
        ) {
            return;
        }

        if (isChangingVisibleImage) {

            const remainingFadeDuration =
                Math.max(
                    0,
                    fadeDuration -
                        (performance.now() - fadeStartedAt)
                );

            await new Promise(
                resolve => {
                    setTimeout(
                        resolve,
                        remainingFadeDuration
                    );
                }
            );

            if (
                requestVersion !==
                imageRequestVersion
            ) {
                return;
            }

        }

        if (imagePoemButtonSource) {

            imagePoemButtonImage.src =
                imagePoemButtonSource;

        }

        contentImage.src =
            image.src;

        imageScreen.scrollTop =
            0;

        updateImageButtons();


        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    () => {

                        imageScreen.classList.remove(
                            "preparing"
                        );

                        requestAnimationFrame(
                            () => {

                                imageScreen.classList.remove(
                                    "loading"
                                );

                            }
                        );

                    }
                );

            }
        );

    };


    image.onerror = () => {

        if (
            requestVersion !==
            imageRequestVersion
        ) {
            return;
        }

        console.error(
            "Attēlu neizdevās ielādēt:",
            imageFilename
        );

        /*
         * Arī kļūdas gadījumā
         * atgriežam opacity.
         */

        contentImage.src =
            "";

        imageScreen.classList.add(
            "active"
        );

        imageScreen.classList.remove(
            "preparing"
        );

        imageScreen.classList.remove(
            "loading"
        );

    };


    image.src =
        `assets/${imageFilename}`;

}


imagePoemButton.addEventListener(
    "click",
    () => {

        openImage(
            currentSection,
            currentImageIndex,
            true
        );

    }
);

imageReturnButton.addEventListener(
    "click",
    () => {

        openImage(
            currentSection,
            currentImageIndex
        );

    }
);

imagePoemButtonImage.addEventListener(
    "error",
    () => {

        console.error(
            "Dzejoļa poga neizdevās ielādēt:",
            imagePoemButtonImage.src
        );

    }
);


/* ================================================================
   ATTĒLA HOME
   ================================================================ */

imageHomeButton.addEventListener(
    "click",
    async () => {

        if (isBusy) {
            return;
        }

        isBusy = true;

        /*
         * Attēla HOME izlaiž outro un atgriežas tieši uz intro_repeat.mp4.
         */

        await fadeToBlack(
            CONFIG.webpFadeDuration
        );

        await startIntroRepeat();

        await fadeFromBlack(
            CONFIG.webpFadeDuration
        );

        isBusy = false;

    }
);


/* ================================================================
   ATTĒLA BACK
   ================================================================ */

imageBackButton.addEventListener(
    "click",
    () => {

        if (
            currentImageIndex <= 0
        ) {
            return;
        }

        currentImageIndex--;

        openImage(
            currentSection,
            currentImageIndex,
            imageReturnButton.classList.contains(
                "visible"
            )
        );

    }
);


/* ================================================================
   ATTĒLA FORWARD
   ================================================================ */

imageForwardButton.addEventListener(
    "click",
    () => {

        if (
            currentImageIndex >=
            currentImageGroup.length - 1
        ) {
            return;
        }

        currentImageIndex++;

        openImage(
            currentSection,
            currentImageIndex,
            imageReturnButton.classList.contains(
                "visible"
            )
        );

    }
);


/* ================================================================
   ATTĒLU NAVIGĀCIJAS POGU STĀVOKLIS
   ================================================================ */

function updateImageButtons() {

    if (
        currentImageIndex <= 0
    ) {

        imageBackButton.classList.add(
            "disabled"
        );

    } else {

        imageBackButton.classList.remove(
            "disabled"
        );

    }


    if (
        currentImageIndex >=
        currentImageGroup.length - 1
    ) {

        imageForwardButton.classList.add(
            "disabled"
        );

    } else {

        imageForwardButton.classList.remove(
            "disabled"
        );

    }

}


/* ================================================================
    2 MINŪŠU NEAKTIVITĀTES RESET
   ================================================================ */

async function resetToBeginning(force = false) {

    if (isBusy && !force) {
        return;
    }

    idleResetVersion++;

    isBusy = true;
    isResetting = true;

    clearTimers();

    clearVideoTimeout();

    imageRequestVersion++;

    await fadeToBlack();

    stopAllVideos();

    stopSoundtrack();

    /*
     * Atiestatām visus video.
     */

    [
        introVideo,

        transitionVideo,

        repeatVideo,

        ...Object.values(
            sectionVideos
        )

    ].forEach(
        video => resetVideo(video)
    );


    /*
     * Paslēpjam izvēlnes.
     */

    mainMenu.classList.remove(
        "visible"
    );

    repeatMenu.classList.remove(
        "visible"
    );


    document
        .querySelectorAll(
            ".sub-menu"
        )
        .forEach(
            menu => {

                menu.classList.remove(
                    "visible"
                );

            }
        );


    document
        .querySelectorAll(
            ".section-video-screen"
        )
        .forEach(
            screen => {

                screen.classList.remove(
                    "controls-visible"
                );

            }
        );


    /*
     * PNG aizveram.
     */

    imageScreen.classList.remove(
        "active"
    );


    /*
     * Sākums:
     * lingering.png.
     */

    showScreen(
        lingeringScreen
    );


    /*
     * Lingering ekrānam nav taimera.
     */

    await fadeFromBlack();

    isResetting = false;
    isBusy = false;

}


/* ================================================================
   VIDEO END — FREEZE FRAME
   ================================================================ */

[
    introVideo,

    transitionVideo,

    repeatVideo,

    ...Object.values(
        sectionVideos
    )

].forEach(
    video => {

        video.addEventListener(
            "ended",
            () => {

                /*
                 * Video netiek resetēts.
                 * Tādēļ pārlūks atstāj pēdējo
                 * frame redzamu.
                 */

                video.pause();

            }
        );

    }
);


/* ================================================================
   PRELOAD — VIDEO
   ================================================================ */

/* ================================================================
   PRELOAD — PNG
   ================================================================ */

const imageFiles = [

    "lingering.png",
    "lingering_paraksts.png",

    "poga_home.png",
    "poga_back.png",
    "poga_forward.png",
    "poga_return.png",
    ...Object.keys(poemImageFiles).map(
        filename =>
            `poga_${filename.replace(/\.webp$/i, "")}.png`
    ),
    ...Object.values(poemImageFiles),

    "sieviete.webp",
    "dvesele.webp",
    "milestiba.webp",

    "valsts.webp",
    "eiropaskulturasdarza.webp",
    "majas.webp",

    "saule.webp",
    "lidojums.webp",
    "menessunzvaigznes.webp",

    "raganas.webp",
    "dabasparadibas.webp",
    "mitologiskievaroni.webp",

    "aspazijasdebesjums.webp"

];


function preloadImages() {

    imageFiles.forEach(
        filename => {

            const image =
                new Image();

            image.src =
                `assets/${filename}`;

        }
    );

}


/* ================================================================
   RESIZE
   ================================================================ */

window.addEventListener(
    "resize",
    () => {

        scaleStage();

        scaleMenu(
            mainMenu
        );

        scaleMenu(
            repeatMenu
        );

    }
);


/* ================================================================
   ESC
   ================================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            resetToBeginning();

        }


        if (
            imageScreen.classList.contains(
                "active"
            )
        ) {

            if (
                event.key ===
                "ArrowLeft"
            ) {

                imageBackButton.click();

            }


            if (
                event.key ===
                "ArrowRight"
            ) {

                imageForwardButton.click();

            }

        }

    }
);


[
    "pointerdown",
    "pointermove",
    "keydown",
    "wheel",
    "touchstart",
    "touchmove"
].forEach(
    eventName => {

        document.addEventListener(
            eventName,
            () => {

                if (
                    lingeringScreen.classList.contains("active") ||
                    isResetting
                ) {
                    return;
                }

                startVideoTimeout();

            },
            { passive: true }
        );

    }
);


/* ================================================================
   INIT
   ================================================================ */

function init() {

    scaleStage();

    /*
     * Obligāti sākam ar lingering.
     */

    showScreen(
        lingeringScreen
    );


    /*
     * Lingering paliek bezgalīgi.
     */

    clearVideoTimeout();


    /*
     * Galvenā izvēlne sākumā neredzama.
     */

    mainMenu.classList.remove(
        "visible"
    );


    /*
     * Preload.
     */

    preloadImages();


    /*
     * Sākotnējā koordinātu sistēma.
     */

    scaleMenu(
        mainMenu
    );

    scaleMenu(
        repeatMenu
    );

}


/* ================================================================
   START
   ================================================================ */

init();

</script>
